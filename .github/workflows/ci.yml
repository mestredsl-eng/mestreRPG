name: CI

on:
  pull_request:
    branches:
      - main
      - feat/mesa-virtual-mapas-tokens
      - feat/mesa-virtual-nevoa-backend
      - feat/mesa-virtual-nevoa-frontend
      - feat/convites-internos-guilda-api
      - feat/guilda-responsavel-backend
      - feat/issue-186-sangue-core
      - feat/issue-127-token-vida
      # Cadeia Issue #186 (missão #7056575362): bases #222–#230
      - feat/issue-186-d10-sangue-cobranca
      - feat/issue-186-sangue-poderes-ui
      - feat/issue-186-sangue-actions-service
      - test/issue-186-sangue-invariantes
      - feat/issue-186-sangue-xp-capacidade
      - feat/issue-186-sangue-read-api
      - feat/issue-186-sangue-xp-ui
      - feat/issue-186-sangue-player-read-ui
      - feat/issue-186-sangue-runtime-actions
      - feat/issue-186-sangue-config
      - feat/issue-186-sangue-rules-runtime-config
      - feat/issue-186-d10-transaction-core
      - feat/issue-186-sangue-d10-zero-custo
      - feat/issue-186-sangue-capacidade-reducao
      - feat/issue-186-poder-d10-eligibility
      - feat/issue-186-sangue-capacidade-flag
      - fix/issue-186-d10-sangue-cobranca-p2s
      # Base da PR empilhada sobre #232 (ex.: C8-D) — a #232 em si já
      # é coberta pela base feat/issue-186-sangue-player-read-ui acima.
      - feat/issue-186-sangue-actions-ui
      # Base real da PR #218 (movimento reduzido) — faz o CI rodar nela.
      - feat/issue-132-recomendacoes-visuais-locais
      - feat/issue-132-reduced-motion
      - feat/issue-132-icones-abas
      - feat/issue-185-xp-lote
      - feat/issue-185-xp-historico-ui
      - ci/issue-186-sangue-hmac-v2-tests
      - feat/issue-155-startup-auto-update
      - fix/issue-155-status-hardening
      - fix/issue-155-boot-lock
      - test/issue-155-homologacao-w
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
  push:
    branches:
      - main
      - integracao/acervo
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Número da PR a homologar (checkout do merge ref refs/pull/N/merge)"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

jobs:
  servidor:
    name: Servidor — typecheck, build e suítes sem navegador
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolver alvo da execução
        id: alvo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pr_number inválido: '$PR_NUMBER'"
            exit 1
          fi
          meta=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER") \
            || { echo "::error::PR #$PR_NUMBER não encontrada"; exit 1; }
          state=$(jq -r '.state' <<<"$meta")
          merged=$(jq -r '.merged' <<<"$meta")
          if [ "$state" != "open" ] || [ "$merged" != "false" ]; then
            echo "::error::PR #$PR_NUMBER não está aberta ou já foi mesclada (state=$state merged=$merged)"
            exit 1
          fi
          repo_url="https://github.com/${GITHUB_REPOSITORY}.git"
          merge_sha="$(
            GIT_TERMINAL_PROMPT=0 \
            git ls-remote "$repo_url" "refs/pull/${PR_NUMBER}/merge" |
            awk 'NR == 1 { print $1 }'
          )"
          if ! [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Merge ref da PR #$PR_NUMBER ausente ou inválida"
            exit 1
          fi
          echo "ref=refs/pull/$PR_NUMBER/merge" >> "$GITHUB_OUTPUT"
          echo "sha=$merge_sha" >> "$GITHUB_OUTPUT"
          echo "Homologando PR #$PR_NUMBER — merge ref $merge_sha"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.alvo.outputs.ref }}
      - name: Confirmar revisão testada
        run: |
          echo "SHA efetivamente testado: $(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            test "$(git rev-parse HEAD)" = "${{ steps.alvo.outputs.sha }}" \
              || { echo "::error::checkout diverge do merge ref esperado"; exit 1; }
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript servidor
        run: npx tsc --noEmit -p servidor/tsconfig.json
      - name: TypeScript site
        run: npx tsc --noEmit -p site/tsconfig.json
      - name: Build workspaces
        run: npm run build
      - name: Testes unitários do contrato de backup (Issue #155 W16)
        run: |
          if [ -f servidor/testes/backup-contrato.test.ts ]; then
            npx tsx --test servidor/testes/backup-contrato.test.ts
          else
            echo "backup-contrato.test.ts ausente nesta ref (pré-#193) — pulado"
          fi
      - name: Testes unitários do catálogo visual (Issue #132, etapa 2.2a)
        run: npx tsx teste-temas-visuais.mjs
      - name: Testes unitários do limitador Socket.IO
        run: npx tsx servidor/testes/socket-rate-limit.test.ts
      - name: Testes unitários da iniciativa
        run: npm run test:iniciativa --workspace servidor
      - name: Testes unitários da régua VTT (#125)
        run: npm run test:regua --workspace servidor
      - name: Testes unitários da convenção D10
        run: npm run test:d10 --workspace servidor
      - name: Testes unitários da guarda do último GM
        run: npm run test:guildas-guarda --workspace servidor
      - name: Testes de formatação das rolagens do histórico
        run: npx tsx teste-historico-rolagens.mjs
      - name: Verificar e materializar unitários obrigatórios Sangue/C7
        shell: bash
        run: |
          set -euo pipefail
          echo "PWD: $PWD"
          echo "HEAD: $(git rev-parse HEAD)"
          arquivos=(
            servidor/testes/assinatura-v2.test.ts
            servidor/testes/sangue.test.ts
            servidor/testes/revinculacao-ficha.test.ts
            servidor/testes/sangue-acoes.test.ts
            servidor/testes/sangue-invariantes.test.ts
          )
          for arquivo in "${arquivos[@]}"; do
            esperado="$(git rev-parse "HEAD:$arquivo")"
            git ls-files --error-unmatch "$arquivo" >/dev/null
            atual=""
            if [ -f "$arquivo" ]; then atual="$(git hash-object "$arquivo")"; fi
            if [ "$atual" != "$esperado" ]; then
              echo "::warning::Materializando $arquivo do HEAD ($esperado); workspace tinha '${atual:-ausente}'"
              git checkout HEAD -- "$arquivo"
            fi
            atual="$(git hash-object "$arquivo")"
            if [ "$atual" != "$esperado" ]; then
              echo "::error::Arquivo obrigatório não corresponde ao blob do HEAD: $arquivo"
              exit 1
            fi
            ls -l "$arquivo"
          done
      - name: Testes unitários HMAC v2 XP+Sangue (Issue #186 C3)
        run: npx tsx --test servidor/testes/assinatura-v2.test.ts
      - name: Testes unitários do ledger de Sangue (Issue #186 C2/C4)
        run: npx tsx --test servidor/testes/sangue.test.ts
      - name: Testes unitários da revinculação de ficha (Issue #186 C7)
        run: npx tsx --test servidor/testes/revinculacao-ficha.test.ts
      - name: Testes unitários das ações de Sangue (Issue #186 #224)
        run: npx tsx --test servidor/testes/sangue-acoes.test.ts
      - name: Testes unitários dos invariantes do ledger (Issue #186 #225)
        run: npx tsx --test servidor/testes/sangue-invariantes.test.ts
      - name: Suítes obrigatórias v1.0.8 — Servidor sem navegador
        shell: bash
        run: |
          set -euo pipefail
          arquivos=(
            teste-novidades.mjs
            teste-novidades-realtime.mjs
            teste-importacao-integridade.mjs
            teste-progressao-xp.mjs
            teste-regras.mjs
            teste-d10-minimo-servidor.mjs
            teste-sangue-hmac-v2.mjs
            teste-sangue-config.mjs
            teste-d10-transacao.mjs
            teste-d10-sangue-cobranca.mjs
            teste-d10-sangue-nao-poder-isolado.mjs
            teste-sangue-xp-capacidade.mjs
            teste-sangue-read-api.mjs
            teste-sangue-runtime.mjs
            teste-sangue-poderes-acoes.mjs
            teste-vtt-vida-p1-privacidade.mjs
            teste-vtt-vida.mjs
            teste-vitalidade-historico.mjs
            teste-vida-conversao.mjs
            teste-npc-visibilidade.mjs
            teste-mesa-seguranca.mjs
            teste-mesa-virtual.mjs
            teste-autorizacao-negativa.mjs
            teste-autorizacao-eventos-passivos.mjs
            teste-autorizacao-concorrencia.mjs
            teste-rate-limit-socket.mjs
            teste-sessoes-socket.mjs
            teste-xp-lote.mjs
            teste-xp-ancora-integridade-pilha.mjs
          )
          for s in "${arquivos[@]}"; do
            if [ ! -f "$s" ]; then
              echo "::error::Suíte obrigatória da v1.0.8 ausente: $s"
              exit 1
            fi
            echo "===== $s ====="
            node "$s"
          done
  auto_update_windows:
    name: Auto-update — Windows (npm.cmd + Git)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Resolver alvo da execução
        id: alvo
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pr_number inválido: '$PR_NUMBER'"
            exit 1
          fi
          meta=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER") \
            || { echo "::error::PR #$PR_NUMBER não encontrada"; exit 1; }
          state=$(jq -r '.state' <<<"$meta")
          merged=$(jq -r '.merged' <<<"$meta")
          if [ "$state" != "open" ] || [ "$merged" != "false" ]; then
            echo "::error::PR #$PR_NUMBER não está aberta ou já foi mesclada (state=$state merged=$merged)"
            exit 1
          fi
          repo_url="https://github.com/${GITHUB_REPOSITORY}.git"
          merge_sha="$(
            GIT_TERMINAL_PROMPT=0 \
            git ls-remote "$repo_url" "refs/pull/${PR_NUMBER}/merge" |
            awk 'NR == 1 { print $1 }'
          )"
          if ! [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Merge ref da PR #$PR_NUMBER ausente ou inválida"
            exit 1
          fi
          echo "ref=refs/pull/$PR_NUMBER/merge" >> "$GITHUB_OUTPUT"
          echo "sha=$merge_sha" >> "$GITHUB_OUTPUT"
          echo "Homologando PR #$PR_NUMBER — merge ref $merge_sha"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.alvo.outputs.ref }}
      - name: Confirmar revisão testada
        shell: bash
        run: |
          echo "SHA efetivamente testado: $(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            test "$(git rev-parse HEAD)" = "${{ steps.alvo.outputs.sha }}" \
              || { echo "::error::checkout diverge do merge ref esperado"; exit 1; }
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build workspaces no Windows
        run: npm run build
      - name: Homologação de atualização e restauração no Windows (Issue #33)
        run: node teste-atualizacao-instalacao.mjs
      - name: Testes do auto-update e execução real de npm.cmd
        shell: bash
        run: |
          if [ ! -f teste-auto-update.mjs ]; then echo "teste-auto-update.mjs ausente nesta ref — pulado"; exit 0; fi
          node teste-auto-update.mjs
      - name: Boot lock — Node 22
        shell: bash
        run: |
          if [ ! -f teste-boot-lock.mjs ]; then echo "teste-boot-lock.mjs ausente nesta ref — pulado"; exit 0; fi
          node teste-boot-lock.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Boot lock — Node 20 (versão mínima declarada)
        shell: bash
        run: |
          if [ ! -f teste-boot-lock.mjs ]; then echo "teste-boot-lock.mjs ausente nesta ref — pulado"; exit 0; fi
          node teste-boot-lock.mjs

  navegador:
    name: Navegador — homologações Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolver alvo da execução
        id: alvo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pr_number inválido: '$PR_NUMBER'"
            exit 1
          fi
          meta=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER") \
            || { echo "::error::PR #$PR_NUMBER não encontrada"; exit 1; }
          state=$(jq -r '.state' <<<"$meta")
          merged=$(jq -r '.merged' <<<"$meta")
          if [ "$state" != "open" ] || [ "$merged" != "false" ]; then
            echo "::error::PR #$PR_NUMBER não está aberta ou já foi mesclada (state=$state merged=$merged)"
            exit 1
          fi
          repo_url="https://github.com/${GITHUB_REPOSITORY}.git"
          merge_sha="$(
            GIT_TERMINAL_PROMPT=0 \
            git ls-remote "$repo_url" "refs/pull/${PR_NUMBER}/merge" |
            awk 'NR == 1 { print $1 }'
          )"
          if ! [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Merge ref da PR #$PR_NUMBER ausente ou inválida"
            exit 1
          fi
          echo "ref=refs/pull/$PR_NUMBER/merge" >> "$GITHUB_OUTPUT"
          echo "sha=$merge_sha" >> "$GITHUB_OUTPUT"
          echo "Homologando PR #$PR_NUMBER — merge ref $merge_sha"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.alvo.outputs.ref }}
      - name: Confirmar revisão testada
        run: |
          echo "SHA efetivamente testado: $(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            test "$(git rev-parse HEAD)" = "${{ steps.alvo.outputs.sha }}" \
              || { echo "::error::checkout diverge do merge ref esperado"; exit 1; }
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build workspaces
        run: npm run build
      # Sem --with-deps: a etapa apt é ponto único de falha (o mirror
      # azure.archive.ubuntu.com dos runners ficou indisponível por DNS e
      # derrubou o job antes dos testes). A imagem ubuntu-latest já traz
      # as libs gráficas necessárias (Chrome/Firefox/Edge pré-instalados);
      # o step seguinte comprova o launch antes das suítes.
      - name: Chromium para Playwright
        run: npx playwright install chromium
      - name: Verificar inicialização do Chromium
        run: node -e "import('playwright').then(async ({ chromium }) => { const b = await chromium.launch(); await b.close(); console.log('chromium launch ok'); })"
      - name: Suítes obrigatórias v1.0.8 — Navegador
        shell: bash
        run: |
          set -euo pipefail
          arquivos=(
            homologacao-npc-patrimonio.mjs
            homologacao-vida-vtt.mjs
            homologacao-vida-regua.mjs
            teste-permissao-tempo-real.mjs
            homologacao-mesa-virtual.mjs
            homologacao-regua.mjs
            homologacao-nevoa.mjs
            teste-vtt-rollback-p6.mjs
            teste-vtt-nevoa.mjs
            teste-vtt-regua.mjs
            homologacao-papeis-ui.mjs
            teste-sangue-config-ui.mjs
            teste-sangue-xp-capacidade-ui.mjs
            teste-sangue-player-read-ui.mjs
            teste-sangue-actions-ui.mjs
            homologacao-patrimonio.mjs
            homologacao-patrimonio-permissoes.mjs
            homologacao-sessoes.mjs
            teste-realtime-paginas.mjs
            homologacao-pacotes-forjados.mjs
            teste-a11y-fluxos-297.mjs
          )
          for s in "${arquivos[@]}"; do
            if [ ! -f "$s" ]; then
              echo "::error::Suíte obrigatória da v1.0.8 ausente: $s"
              exit 1
            fi
            echo "===== $s ====="
            node "$s"
          done
      - name: Suíte E2E do Extrato XP (Issue #185 — obrigatória, sem SKIP)
        run: |
          echo "===== teste-xp-historico-ui.mjs ====="
          node teste-xp-historico-ui.mjs
      - name: E2E concessão XP em lote (#185)
        run: node teste-xp-lote-ui.mjs
