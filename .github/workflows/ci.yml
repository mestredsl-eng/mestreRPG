name: CI

on:
  pull_request:
    branches:
      - main
      - feat/mesa-virtual-mapas-tokens
      - feat/mesa-virtual-nevoa-backend
      - feat/mesa-virtual-nevoa-frontend
      - feat/convites-internos-guilda-api
      - feat/guilda-responsavel-backend
      - feat/issue-186-sangue-core
      - feat/issue-127-token-vida
      # Cadeia Issue #186 (missão #7056575362): bases #222–#230
      - feat/issue-186-d10-sangue-cobranca
      - feat/issue-186-sangue-poderes-ui
      - feat/issue-186-sangue-actions-service
      - test/issue-186-sangue-invariantes
      - feat/issue-186-sangue-xp-capacidade
      - feat/issue-186-sangue-read-api
      - feat/issue-186-sangue-xp-ui
      - feat/issue-186-sangue-player-read-ui
      - feat/issue-186-sangue-runtime-actions
      - feat/issue-186-sangue-config
      - feat/issue-186-sangue-rules-runtime-config
      - feat/issue-186-d10-transaction-core
      - feat/issue-186-sangue-d10-zero-custo
      - feat/issue-186-sangue-capacidade-reducao
      - feat/issue-186-poder-d10-eligibility
      - feat/issue-186-sangue-capacidade-flag
      - fix/issue-186-d10-sangue-cobranca-p2s
      # Base da PR empilhada sobre #232 (ex.: C8-D) — a #232 em si já
      # é coberta pela base feat/issue-186-sangue-player-read-ui acima.
      - feat/issue-186-sangue-actions-ui
      # Base real da PR #218 (movimento reduzido) — faz o CI rodar nela.
      - feat/issue-132-recomendacoes-visuais-locais
      - feat/issue-132-reduced-motion
      - feat/issue-132-icones-abas
      - feat/issue-185-xp-lote
      - ci/issue-186-sangue-hmac-v2-tests
      - feat/issue-155-startup-auto-update
      - fix/issue-155-status-hardening
      - fix/issue-155-boot-lock
      - test/issue-155-homologacao-w
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
  push:
    branches:
      - main
      - integracao/acervo
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Número da PR a homologar (checkout do merge ref refs/pull/N/merge)"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

jobs:
  servidor:
    name: Servidor — typecheck, build e suítes sem navegador
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolver alvo da execução
        id: alvo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pr_number inválido: '$PR_NUMBER'"
            exit 1
          fi
          meta=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER") \
            || { echo "::error::PR #$PR_NUMBER não encontrada"; exit 1; }
          state=$(jq -r '.state' <<<"$meta")
          merged=$(jq -r '.merged' <<<"$meta")
          if [ "$state" != "open" ] || [ "$merged" != "false" ]; then
            echo "::error::PR #$PR_NUMBER não está aberta ou já foi mesclada (state=$state merged=$merged)"
            exit 1
          fi
          repo_url="https://github.com/${GITHUB_REPOSITORY}.git"
          merge_sha="$(
            GIT_TERMINAL_PROMPT=0 \
            git ls-remote "$repo_url" "refs/pull/${PR_NUMBER}/merge" |
            awk 'NR == 1 { print $1 }'
          )"
          if ! [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Merge ref da PR #$PR_NUMBER ausente ou inválida"
            exit 1
          fi
          echo "ref=refs/pull/$PR_NUMBER/merge" >> "$GITHUB_OUTPUT"
          echo "sha=$merge_sha" >> "$GITHUB_OUTPUT"
          echo "Homologando PR #$PR_NUMBER — merge ref $merge_sha"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.alvo.outputs.ref }}
      - name: Confirmar revisão testada
        run: |
          echo "SHA efetivamente testado: $(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            test "$(git rev-parse HEAD)" = "${{ steps.alvo.outputs.sha }}" \
              || { echo "::error::checkout diverge do merge ref esperado"; exit 1; }
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript servidor
        run: npx tsc --noEmit -p servidor/tsconfig.json
      - name: TypeScript site
        run: npx tsc --noEmit -p site/tsconfig.json
      - name: Build workspaces
        run: npm run build
      - name: Testes unitários do contrato de backup (Issue #155 W16)
        run: |
          if [ -f servidor/testes/backup-contrato.test.ts ]; then
            npx tsx --test servidor/testes/backup-contrato.test.ts
          else
            echo "backup-contrato.test.ts ausente nesta ref (pré-#193) — pulado"
          fi
      - name: Testes unitários do catálogo visual (Issue #132, etapa 2.2a)
        run: npx tsx teste-temas-visuais.mjs
      - name: Testes unitários do limitador Socket.IO
        run: npx tsx servidor/testes/socket-rate-limit.test.ts
      - name: Testes unitários da iniciativa
        run: npm run test:iniciativa --workspace servidor
      - name: Testes unitários da régua VTT (#125)
        run: npm run test:regua --workspace servidor
      - name: Testes unitários da convenção D10
        run: npm run test:d10 --workspace servidor
      - name: Testes unitários da guarda do último GM
        run: npm run test:guildas-guarda --workspace servidor
      - name: Testes de formatação das rolagens do histórico
        run: npx tsx teste-historico-rolagens.mjs
      - name: Testes unitários HMAC v2 XP+Sangue (Issue #186 C3)
        run: |
          if [ -f servidor/testes/assinatura-v2.test.ts ]; then
            npx tsx --test servidor/testes/assinatura-v2.test.ts
          else
            echo "assinatura-v2.test.ts ausente nesta ref (pré-C3) — pulado"
          fi
      - name: Testes unitários do ledger de Sangue (Issue #186 C2/C4)
        run: |
          if [ -f servidor/testes/sangue.test.ts ]; then
            npx tsx --test servidor/testes/sangue.test.ts
          else
            echo "sangue.test.ts ausente nesta ref (pré-C2) — pulado"
          fi
      - name: Testes unitários da revinculação de ficha (Issue #186 C7)
        run: |
          if [ -f servidor/testes/revinculacao-ficha.test.ts ]; then
            npx tsx --test servidor/testes/revinculacao-ficha.test.ts
          else
            echo "revinculacao-ficha.test.ts ausente nesta ref (pré-C7) — pulado"
          fi
      - name: Testes unitários das ações de Sangue (Issue #186 #224)
        run: |
          if [ -f servidor/testes/sangue-acoes.test.ts ]; then
            npx tsx --test servidor/testes/sangue-acoes.test.ts
          else
            echo "sangue-acoes.test.ts ausente nesta ref (pré-#224) — pulado"
          fi
      - name: Testes unitários dos invariantes do ledger (Issue #186 #225)
        run: |
          if [ -f servidor/testes/sangue-invariantes.test.ts ]; then
            npx tsx --test servidor/testes/sangue-invariantes.test.ts
          else
            echo "sangue-invariantes.test.ts ausente nesta ref (pré-#225) — pulado"
          fi
      - name: Suítes residuais Acervo + dados 3D (sem navegador)
        run: |
          set -e
          for s in \
            homologacao-acervo.mjs \
            teste-acervo-campanha.mjs \
            teste-acervo-sync.mjs \
            teste-acervo-diff.mjs \
            teste-fisica-dados.mjs \
            teste-fisica-mesa.mjs \
