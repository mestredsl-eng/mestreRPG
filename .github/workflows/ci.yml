name: CI

on:
  pull_request:
    branches:
      - main
      - feat/mesa-virtual-mapas-tokens
      - feat/mesa-virtual-nevoa-backend
      - feat/mesa-virtual-nevoa-frontend
      - feat/convites-internos-guilda-api
      - feat/guilda-responsavel-backend
      - fix/issue-155-status-hardening
      - fix/issue-155-boot-lock
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
  push:
    branches:
      - main
      - integracao/acervo
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Número da PR a homologar (checkout do merge ref refs/pull/N/merge)"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

jobs:
  servidor:
    name: Servidor — typecheck, build e suítes sem navegador
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolver alvo da execução
        id: alvo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pr_number inválido: '$PR_NUMBER'"
            exit 1
          fi
          meta=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER") \
            || { echo "::error::PR #$PR_NUMBER não encontrada"; exit 1; }
          state=$(jq -r '.state' <<<"$meta")
          merged=$(jq -r '.merged' <<<"$meta")
          if [ "$state" != "open" ] || [ "$merged" != "false" ]; then
            echo "::error::PR #$PR_NUMBER não está aberta ou já foi mesclada (state=$state merged=$merged)"
            exit 1
          fi
          repo_url="https://github.com/${GITHUB_REPOSITORY}.git"
          merge_sha="$(
            GIT_TERMINAL_PROMPT=0 \
            git ls-remote "$repo_url" "refs/pull/${PR_NUMBER}/merge" |
            awk 'NR == 1 { print $1 }'
          )"
          if ! [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Merge ref da PR #$PR_NUMBER ausente ou inválida"
            exit 1
          fi
          echo "ref=refs/pull/$PR_NUMBER/merge" >> "$GITHUB_OUTPUT"
          echo "sha=$merge_sha" >> "$GITHUB_OUTPUT"
          echo "Homologando PR #$PR_NUMBER — merge ref $merge_sha"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.alvo.outputs.ref }}
      - name: Confirmar revisão testada
        run: |
          echo "SHA efetivamente testado: $(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            test "$(git rev-parse HEAD)" = "${{ steps.alvo.outputs.sha }}" \
              || { echo "::error::checkout diverge do merge ref esperado"; exit 1; }
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript servidor
        run: npx tsc --noEmit -p servidor/tsconfig.json
      - name: TypeScript site
        run: npx tsc --noEmit -p site/tsconfig.json
      - name: Build workspaces
        run: npm run build
      - name: Testes unitários do contrato de backup (Issue #266 / W16)
        run: npm run test:backup-contrato -w servidor
      - name: Testes unitários do catálogo visual (Issue #132, etapa 2.2a)
        run: npx tsx teste-temas-visuais.mjs
      - name: Testes unitários do limitador Socket.IO
        run: npx tsx servidor/testes/socket-rate-limit.test.ts
      - name: Testes unitários da iniciativa
        run: npm run test:iniciativa --workspace servidor
      - name: Testes unitários da régua VTT (#125)
        run: npm run test:regua --workspace servidor
      - name: Testes unitários da convenção D10
        run: npm run test:d10 --workspace servidor
      - name: Testes unitários da guarda do último GM
        run: npm run test:guildas-guarda --workspace servidor
      - name: Testes de formatação das rolagens do histórico
        run: npx tsx teste-historico-rolagens.mjs
      - name: Suítes residuais Acervo + dados 3D (sem navegador)
        run: |
          set -e
          for s in \
            homologacao-acervo.mjs \
            teste-acervo-campanha.mjs \
            teste-acervo-sync.mjs \
            teste-acervo-diff.mjs \
            teste-fisica-dados.mjs \
            teste-fisica-mesa.mjs \
            teste-d10-minimo-servidor.mjs \
            teste-restauracao-boot.mjs \
            teste-estado-externo.mjs \
            teste-restauracao-journal.mjs \
            teste-trava-instancia.mjs \
            teste-atualizacao-instalacao.mjs \
            teste-auto-update.mjs \
            teste-primeiro-bootstrap.mjs \
            teste-backup-pre-migration.mjs \
            teste-docs-operacao.mjs \
            homologacao-etapa2.mjs \
            homologacao-final-v1.mjs \
            homologacao-mesa.mjs \
            teste-mesa-seguranca.mjs \
            teste-mesa-virtual.mjs \
            teste-npc-visibilidade.mjs \
            teste-temporizador.mjs \
            teste-convite-cadastro.mjs \
            homologacao-equipamentos.mjs \
            teste-equipamentos.mjs \
            teste-financeiro-atomico.mjs \
            teste-moedas-regressao.mjs \
            teste-vitalidade-historico.mjs \
            teste-vida-conversao.mjs \
            teste-venda-estoque.mjs \
            teste-financeiro-compras.mjs \
            teste-financeiro-integracao.mjs \
            teste-regressao-revisao.mjs \
            teste-pontos-concorrencia.mjs \
            teste-pool-principal-http.mjs \
            teste-novidades.mjs \
            teste-novidades-realtime.mjs \
            teste-sessoes-socket.mjs \
            teste-sessao-numero.mjs \
            teste-rate-limit-socket.mjs \
            teste-validacao-personagem.mjs \
            teste-exclusao-personagem.mjs \
            teste-guildas-admin.mjs \
            teste-convites-guilda.mjs \
            teste-responsavel-guilda.mjs \
            teste-sessoes-conta.mjs \
            teste-prerequisitos-patrimonio.mjs \
            teste-patrimonio-permissoes.mjs \
            teste-escopo-cruzado.mjs \
            teste-ponte-economica-acervo.mjs \
            teste-diario.mjs \
            teste-importacao-integridade.mjs \
            teste-p10c-gates.mjs \
            teste-regras.mjs \
            teste-retratos.mjs \
            teste-biblioteca-conteudo.mjs \
            teste-defeitos-mesa.mjs
          do
            if [ ! -f "$s" ]; then echo "===== $s ===== (ausente nesta ref — pulado)"; continue; fi
            echo "===== $s ====="; node "$s"
          done

  auto_update_windows:
    name: Auto-update — Windows (npm.cmd + Git)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes do auto-update e execução real de npm.cmd
        run: node teste-auto-update.mjs

      - name: Homologar gate Node mínimo no iniciar-mestre-rpg.bat (cmd.exe real)
        run: node teste-bat-node-gate.mjs

      - name: Homologar falha da restauração bloqueia migrate/start (cmd.exe real)
        run: node teste-bat-restauracao-falha.mjs

  navegador:
    name: Navegador — homologações Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolver alvo da execução
        id: alvo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pr_number inválido: '$PR_NUMBER'"
            exit 1
          fi
          meta=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER") \
            || { echo "::error::PR #$PR_NUMBER não encontrada"; exit 1; }
          state=$(jq -r '.state' <<<"$meta")
          merged=$(jq -r '.merged' <<<"$meta")
          if [ "$state" != "open" ] || [ "$merged" != "false" ]; then
            echo "::error::PR #$PR_NUMBER não está aberta ou já foi mesclada (state=$state merged=$merged)"
            exit 1
          fi
          repo_url="https://github.com/${GITHUB_REPOSITORY}.git"
          merge_sha="$(
            GIT_TERMINAL_PROMPT=0 \
            git ls-remote "$repo_url" "refs/pull/${PR_NUMBER}/merge" |
            awk 'NR == 1 { print $1 }'
          )"
          if ! [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Merge ref da PR #$PR_NUMBER ausente ou inválida"
            exit 1
          fi
          echo "ref=refs/pull/$PR_NUMBER/merge" >> "$GITHUB_OUTPUT"
          echo "sha=$merge_sha" >> "$GITHUB_OUTPUT"
          echo "Homologando PR #$PR_NUMBER — merge ref $merge_sha"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.alvo.outputs.ref }}
      - name: Confirmar revisão testada
        run: |
          echo "SHA efetivamente testado: $(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            test "$(git rev-parse HEAD)" = "${{ steps.alvo.outputs.sha }}" \
              || { echo "::error::checkout diverge do merge ref esperado"; exit 1; }
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build workspaces
        run: npm run build
      # Sem --with-deps: a etapa apt é ponto único de falha (o mirror
      # azure.archive.ubuntu.com dos runners ficou indisponível por DNS e
      # derrubou o job antes dos testes). A imagem ubuntu-latest já traz
      # as libs gráficas necessárias (Chrome/Firefox/Edge pré-instalados);
      # o step seguinte comprova o launch antes das suítes.
      - name: Chromium para Playwright
        run: npx playwright install chromium
      - name: Verificar inicialização do Chromium
        run: node -e "import('playwright').then(async ({ chromium }) => { const b = await chromium.launch(); await b.close(); console.log('chromium launch ok'); })"
      - name: Suítes de navegador
        run: |
          set -e
          for s in \
            homologacao-dados3d.mjs \
            teste-acervo-corridas.mjs \
            teste-acessibilidade.mjs \
            homologacao-hp-historico.mjs \
            homologacao-patrimonio.mjs \
            homologacao-npc-patrimonio.mjs \
            homologacao-compras-vendas.mjs \
            homologacao-fin-integracao.mjs \
            homologacao-conversao.mjs \
            homologacao-novidades.mjs \
            homologacao-acervo-sync.mjs \
            homologacao-v1-cobertura.mjs \
            homologacao-primeira-partida.mjs \
            homologacao-visual.mjs \
            homologacao-validacao-ficha.mjs \
            homologacao-exclusao-personagem.mjs \
            homologacao-busca-filtros.mjs \
            teste-realtime-paginas.mjs \
            homologacao-mesa-virtual.mjs \
            homologacao-nevoa.mjs \
            homologacao-guildas.mjs \
            homologacao-sessoes.mjs \
            homologacao-pacotes-forjados.mjs \
            homologacao-split-pages.mjs \
            homologacao-convites-guilda.mjs \
            homologacao-responsavel-guilda.mjs \
            teste-vtt-rollback-p6.mjs \
            teste-vtt-nevoa.mjs \
            teste-permissao-tempo-real.mjs \
            homologacao-temporizador.mjs \
            homologacao-desafio-ficha.mjs \
            homologacao-limitacoes.mjs \
            homologacao-ajuda-contextual.mjs \
            homologacao-retratos.mjs \
            homologacao-defeitos-mesa.mjs \
            homologacao-preferencias-visuais.mjs \
            homologacao-papeis-ui.mjs \
            auditoria-visual.mjs
          do
            if [ ! -f "$s" ]; then echo "===== $s ===== (ausente nesta ref — pulado)"; continue; fi
            echo "===== $s ====="; node "$s"
          done
