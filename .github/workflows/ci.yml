        shell: bash
        run: |
          if [ ! -f teste-boot-lock.mjs ]; then echo "teste-boot-lock.mjs ausente nesta ref — pulado"; exit 0; fi
          node teste-boot-lock.mjs

  navegador:
    name: Navegador — homologações Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolver alvo da execução
        id: alvo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            exit 0
