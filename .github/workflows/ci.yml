      - name: Testes do auto-update e execução real de npm.cmd
        shell: bash
        run: |
          if [ ! -f teste-auto-update.mjs ]; then echo "teste-auto-update.mjs ausente nesta ref — pulado"; exit 0; fi
          node teste-auto-update.mjs
      - name: Boot lock — Node 22
        shell: bash
        run: |
          if [ ! -f teste-boot-lock.mjs ]; then echo "teste-boot-lock.mjs ausente nesta ref — pulado"; exit 0; fi
          node teste-boot-lock.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 20
